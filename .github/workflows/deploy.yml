name: Deploy
on:
  workflow_dispatch:

  push:
    branches:
      - master
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # Reads SPECIFICATIONS in nmostesting/Config.py. For each version, fetches
      # the first existing branch among <version>.x, <version>-dev and <version>.
      - name: Checkout specification repositories
        run: |
          python3 - << 'PY'
          import os
          import subprocess
          import sys
          from nmostesting.Config import SPECIFICATIONS

          def git(args, cwd=None):
              subprocess.run(["git", *args], cwd=cwd, check=True)

          os.makedirs("cache", exist_ok=True)
          for repo_key, repo_data in SPECIFICATIONS.items():
              repo = repo_data["repo"]
              if repo is None:
                  continue
              dest = os.path.join("cache", repo_key)
              url = "https://github.com/AMWA-TV/{}.git".format(repo)
              print("Cloning {} into {}".format(url, dest), flush=True)
              git(["clone", "--depth", "1", "--no-tags", url, dest])

              listed = subprocess.run(
                  ["git", "-C", dest, "ls-remote", "--heads", "origin"],
                  check=True, capture_output=True, text=True,
              ).stdout
              heads = set()
              for line in listed.splitlines():
                  ref = line.split()[1]
                  if ref.startswith("refs/heads/"):
                      heads.add(ref[len("refs/heads/"):])

              branches = []
              for version in repo_data["versions"]:
                  candidates = [version + ".x", version + "-dev", version]
                  match = None
                  for candidate in candidates:
                      if candidate in heads:
                          match = candidate
                          break
                  if match is None:
                      sys.exit("No branch for {} version {}: tried {}".format(
                          repo, version, ", ".join(candidates)))
                  if match not in branches:
                      branches.append(match)

              # A depth-1 clone tracks only its default branch. Register the
              # version branches so a later checkout can follow them.
              git(["remote", "set-branches", "origin", *branches], cwd=dest)
              print("Fetching {}: {}".format(repo, ", ".join(branches)), flush=True)
              git(["fetch", "--no-tags", "--depth", "1", "origin"], cwd=dest)
          PY

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nmos-testing
          tags: |
            # Tag all builds with branch name and sha
            type=sha,prefix=${{ github.ref_name }}-
            # Tag if non-master branch with branch name and latest
            type=raw,value=latest,prefix=${{ github.ref_name }}-,enable=${{ github.ref_name != 'master' }}
            # Tag if master branch with latest (no branch name prefix)
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
